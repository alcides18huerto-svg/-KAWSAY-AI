name: Teacher Web CI
on:
  push:
    paths: ["apps/teacher-web/**"]
  pull_request:
    paths: ["apps/teacher-web/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/teacher-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
