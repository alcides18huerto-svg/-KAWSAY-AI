# KAWSAY AI — Blueprint de Render
# https://render.com/docs/blueprint-spec
#
# Backend Python NATIVO (no Docker) con "rootDir: backend",
# más los dos paneles web estáticos y la base de datos PostgreSQL.
services:
  - type: web
    name: kawsay-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: kawsay-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://kawsay-ai-admin-web.onrender.com,https://kawsay-ai-teacher-web.onrender.com

  - type: web
    name: kawsay-ai-admin-web
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend-web/admin-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://kawsay-ai-backend.onrender.com/api/v1

  - type: web
    name: kawsay-ai-teacher-web
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend-web/teacher-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://kawsay-ai-backend.onrender.com/api/v1

databases:
  - name: kawsay-ai-db
    databaseName: kawsay
    user: kawsay
    plan: free
    region: oregon
