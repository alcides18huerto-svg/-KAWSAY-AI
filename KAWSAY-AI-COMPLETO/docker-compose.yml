services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kawsay
      POSTGRES_USER: kawsay
      POSTGRES_PASSWORD: kawsay
    ports:
      - "5432:5432"
    volumes:
      - kawsay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kawsay -d kawsay"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://kawsay:kawsay@postgres:5432/kawsay
      JWT_SECRET: development-only-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      AI_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kawsay_pgdata:
